name: Build & Release App

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi bạn đẩy tag dạng: v1.0.0, v1.0.1,...
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub
    inputs:
      version:
        description: 'Tên phiên bản (VD: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release note (tuỳ chọn). Dùng \n để xuống dòng, hỗ trợ Markdown. Để trống = tự tạo từ các commit.'
        required: false
        default: ''

# Cấp quyền ghi để action có thể tạo Release, tải file lên, và commit lại version bump
permissions:
  contents: write

jobs:
  build-portable-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Xác định tag phiên bản (nếu chạy thủ công thì lấy input, nếu push tag thì lấy ref)
      # Đồng thời tách ra bản "sạch" không có tiền tố v để ghi vào tauri.conf.json / Cargo.toml
      # Giá trị đi qua biến môi trường (không nhúng ${{ }} thẳng vào script) để tránh chèn lệnh.
      - name: Determine Release Tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          echo "tag=$RAW" >> $GITHUB_OUTPUT
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT

      # Ghi số phiên bản vừa xác định vào tauri.conf.json và Cargo.toml,
      # đồng thời tự cache-busting (?v=...) các asset trong index.html theo version mới
      - name: Sync version into project files
        shell: bash
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: node scripts/sync-version.js --set "$VERSION"

      # Chỉ commit lại khi chạy thủ công (workflow_dispatch) vì lúc đó đang đứng trên 1 branch thật.
      # Khi trigger bằng tag push thì bỏ qua (tag không phải branch để push ngược lại được).
      - name: Commit version bump back to repo
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:"$BRANCH"
          else
            echo "Version không đổi, bỏ qua commit."
          fi

      # Chuẩn bị nội dung release note:
      #  - Có nhập release_notes  -> dùng đúng nội dung đó (chuỗi \n được đổi thành xuống dòng thật)
      #  - Để trống / push tag    -> để GitHub tự tạo changelog từ các commit/PR
      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s' "$INPUT_NOTES" | sed 's/\\n/\n/g' > release-notes.md
            echo "body_path=release-notes.md" >> $GITHUB_OUTPUT
            echo "auto=false" >> $GITHUB_OUTPUT
            echo "Dùng release note do người dùng nhập:"
            cat release-notes.md
          else
            echo "body_path=" >> $GITHUB_OUTPUT
            echo "auto=true" >> $GITHUB_OUTPUT
            echo "Không có release note nhập tay, sẽ tự tạo từ commit."
          fi

      - name: Install Node dependencies
        run: npm install

      # Tự động chuyển đổi icon.png ở root thành các kích cỡ & icon.ico cho Windows
      # - name: Generate App Icons
      #   run: npm run tauri icon icon.png

      # Build cả bản portable (.exe chạy thẳng) LẪN bản installer (NSIS .exe + MSI)
      # vì bundle.active đã bật trong tauri.conf.json và không còn truyền --no-bundle nữa.
      - name: Build Portable Executable + Installers
        run: npm run tauri -- build

      # Đổi tên các file output cho rõ ràng: bản portable và 2 bản installer
      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          # --- Bản portable (.exe chạy trực tiếp, không cần cài đặt) ---
          if (Test-Path "src-tauri/target/release/Markdown Live.exe") {
            Copy-Item "src-tauri/target/release/Markdown Live.exe" -Destination "Markdown-Live-Portable.exe"
          } elseif (Test-Path "src-tauri/target/release/markdown-live.exe") {
            Copy-Item "src-tauri/target/release/markdown-live.exe" -Destination "Markdown-Live-Portable.exe"
          } else {
            Write-Error "Không tìm thấy file .exe đầu ra trong target/release!"
            exit 1
          }

          # --- Bản installer NSIS (.exe cài đặt) ---
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination "Markdown-Live-Setup.exe"
          } else {
            Write-Error "Không tìm thấy installer NSIS (.exe) trong target/release/bundle/nsis!"
            exit 1
          }

          # --- Bản installer MSI ---
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "Markdown-Live-Setup.msi"
          } else {
            Write-Error "Không tìm thấy installer MSI (.msi) trong target/release/bundle/msi!"
            exit 1
          }

      # Đẩy tất cả các file (portable + 2 installer) sang mục GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Markdown Live ${{ steps.release_tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.auto == 'true' }}
          draft: false
          prerelease: false
          files: |
            Markdown-Live-Portable.exe
            Markdown-Live-Setup.exe
            Markdown-Live-Setup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}