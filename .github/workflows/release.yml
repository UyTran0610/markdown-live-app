name: Build & Release Portable App

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi bạn đẩy tag dạng: v1.0.0, v1.0.1,...
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub
    inputs:
      version:
        description: 'Tên phiên bản (VD: v1.0.0)'
        required: true
        default: 'v1.0.0'

# Cấp quyền ghi để action có thể tạo Release, tải file lên, và commit lại version bump
permissions:
  contents: write

jobs:
  build-portable-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Xác định tag phiên bản (nếu chạy thủ công thì lấy input, nếu push tag thì lấy ref)
      # Đồng thời tách ra bản "sạch" không có tiền tố v để ghi vào tauri.conf.json / Cargo.toml
      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          echo "tag=$RAW" >> $GITHUB_OUTPUT
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT

      # Ghi số phiên bản vừa xác định vào tauri.conf.json và Cargo.toml,
      # đồng thời tự cache-busting (?v=...) các asset trong index.html theo version mới
      - name: Sync version into project files
        shell: bash
        run: node scripts/sync-version.js --set "${{ steps.release_tag.outputs.version }}"

      # Chỉ commit lại khi chạy thủ công (workflow_dispatch) vì lúc đó đang đứng trên 1 branch thật.
      # Khi trigger bằng tag push thì bỏ qua (tag không phải branch để push ngược lại được).
      - name: Commit version bump back to repo
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.release_tag.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Version không đổi, bỏ qua commit."
          fi

      - name: Install Node dependencies
        run: npm install

      # Tự động chuyển đổi icon.png ở root thành các kích cỡ & icon.ico cho Windows
      # - name: Generate App Icons
      #   run: npm run tauri icon icon.png

      # Build bản release độc lập (bỏ qua bước đóng gói NSIS/MSI)
      - name: Build Portable Executable
        run: npm run tauri -- build --no-bundle

      # Đổi tên file cho rõ ràng và tạo thêm bản nén .zip
      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/Markdown Live.exe") {
            Copy-Item "src-tauri/target/release/Markdown Live.exe" -Destination "Markdown-Live-Portable.exe"
          } elseif (Test-Path "src-tauri/target/release/markdown-live.exe") {
            Copy-Item "src-tauri/target/release/markdown-live.exe" -Destination "Markdown-Live-Portable.exe"
          } else {
            Write-Error "Không tìm thấy file .exe đầu ra trong target/release!"
            exit 1
          }

          # Nén thêm bản .zip dự phòng cho người dùng
          Compress-Archive -Path "Markdown-Live-Portable.exe" -DestinationPath "Markdown-Live-Portable.zip"

      # Đẩy file trực tiếp sang mục GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Markdown Live ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            Markdown-Live-Portable.exe
            Markdown-Live-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}