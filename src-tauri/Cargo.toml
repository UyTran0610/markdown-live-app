[package]
name = "markdown-live"
version = "2.1.0"
description = "Trình soạn thảo Markdown hai chiều thời gian thực (Offline-first)"
authors = ["Uy Tran"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markdown_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-snap-layout = "=1.0.9"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = "2"

# Windows: WebView2 giữ Ctrl+F cho trình tìm của trình duyệt và phím không xuống web.
# Dùng thẳng COM của WebView2 để tắt công tắc đó (wry có sẵn nhưng Tauri chưa truyền qua).
# Phiên bản phải khớp với wry: webview2-com 0.38 + windows-core 0.61.
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[package.metadata.winres]
FileDescription = "Trình soạn thảo Markdown hai chiều thời gian thực"
CompanyName = "Uy Tran"
ProductName = "Markdown Live"
LegalCopyright = "Copyright © 2026 Uy Tran. Released under the MIT License."
