<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Dải màu gradient xanh cyan sang tím cho khung viền bên trong -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Quầng sáng mềm cho chấm đèn xanh lá -->
    <filter id="green-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. NỀN XÁM NGOÀI CÙNG: Đã xóa viền ngoài (không dùng stroke) -->
  <rect width="256" height="256" rx="56" ry="56" fill="#141824" />

  <!-- 2. KHUNG VIỀN NEON BO GÓC BÊN TRONG -->
  <rect x="38" y="66" width="180" height="124" rx="24" ry="24"
        fill="#0f131d" stroke="url(#neon-glow)" stroke-width="8" />

  <!-- 3. ĐÈN BÁO XANH LÁ (có quầng sáng neon) -->
  <circle cx="193" cy="88" r="7" fill="#22c55e" filter="url(#green-glow)" />
  <circle cx="193" cy="88" r="4.5" fill="#4ade80" />

  <!-- 4. CHỮ "M" BO MƯỢT TUYỆT ĐỐI CÁC ĐẦU NÉT VÀ ĐỈNH GÓC -->
  <path d="M 62 156 V 96 L 93 127 L 124 96 V 156"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 5. MŨI TÊN XUỐNG BO TRÒN ĐỒNG BỘ -->
  <!-- Thân mũi tên -->
  <path d="M 168 96 V 150"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round" />
  <!-- Đầu nhọn mũi tên bo tròn mượt -->
  <path d="M 148 132 L 168 152 L 188 132"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>