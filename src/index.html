<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <!-- Phiên bản About; scripts/sync-version.js ghi đè mỗi lần dev/build, không sửa tay. -->
    <meta name="app-version" content="2.0.3">
    <title>Markdown Live</title>
    <!-- 4 CSS theme Preview nạp sẵn, media="not all" = tải nhưng không áp dụng; đổi theme chỉ gán media,
         không fetch nên Editor và Preview đổi màu cùng lúc. -->
    <link rel="stylesheet" href="vendor/github-markdown-light.css?v=2.0.3" data-theme-css="light">
    <link rel="stylesheet" href="vendor/hljs-github.min.css?v=2.0.3" data-theme-css="light">
    <link rel="stylesheet" href="vendor/github-markdown-dark.css?v=2.0.3" data-theme-css="dark" media="not all">
    <link rel="stylesheet" href="vendor/hljs-github-dark.min.css?v=2.0.3" data-theme-css="dark" media="not all">
    <script>
        // Áp theme sớm để tránh nháy sai giao diện: dùng lựa chọn đã lưu, không có thì theo hệ thống.
        (function () {
            var theme = 'light';
            try {
                var stored = localStorage.getItem('markdown-live-theme');
                if (stored === 'light' || stored === 'dark') {
                    theme = stored;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (e) {}

            document.documentElement.setAttribute('data-theme', theme);

            var links = document.querySelectorAll('link[data-theme-css]');
            for (var i = 0; i < links.length; i++) {
                links[i].media = links[i].getAttribute('data-theme-css') === theme ? 'all' : 'not all';
            }
        })();
    </script>
    <link rel="stylesheet" href="vendor/katex.min.css?v=2.0.3">  
    <link rel="stylesheet" href="css/tokens.css?v=2.0.3">
    <link rel="stylesheet" href="css/base.css?v=2.0.3">
    <link rel="stylesheet" href="css/layout.css?v=2.0.3">
    <link rel="stylesheet" href="css/format-bar.css?v=2.0.3">
    <link rel="stylesheet" href="css/dialogs.css?v=2.0.3">
    <link rel="stylesheet" href="css/toast.css?v=2.0.3">
    <link rel="stylesheet" href="css/toolbar.css?v=2.0.3">
    <link rel="stylesheet" href="css/tabs.css?v=2.0.3">
    <link rel="stylesheet" href="css/editor.css?v=2.0.3">
    <link rel="stylesheet" href="css/preview.css?v=2.0.3">
    <link rel="stylesheet" href="css/print.css?v=2.0.3">
    <!-- defer: parse/paint xong HTML rồi mới chạy, vẫn đúng thứ tự khai báo, trước DOMContentLoaded. -->
    <script src="vendor/lucide.min.js?v=2.0.3" defer></script>
    <script src="vendor/marked.umd.js?v=2.0.3" defer></script>
    <script src="vendor/purify.min.js?v=2.0.3" defer></script>
    <script src="vendor/highlight.min.js?v=2.0.3" defer></script>
    <script src="vendor/mermaid.min.js?v=2.0.3" defer></script>
    <script src="vendor/katex.min.js?v=2.0.3" defer></script>
    <script src="vendor/marked-katex-extension.umd.js?v=2.0.3" defer></script>
</head>
<body>

    <header class="app-header">
        <!-- Titlebar tự vẽ: dải tab, vùng kéo, 3 nút cửa sổ. -->
        <div class="titlebar">
            <!-- KHÔNG đặt data-tauri-drag-region lên #tab-strip: Tauri dừng ở ancestor đầu tiên có
                 attribute, nên bấm tab sẽ kéo cả cửa sổ và tab fixed lệch khỏi chuột.
                 Vùng kéo là .titlebar-drag bên phải. -->
            <!-- Icon app, không tên app; draggable="false" vì user-select: none không chặn kéo ảnh HTML5. -->
            <img class="titlebar-icon" src="assets/icon-128.png" alt="" draggable="false">
            <div id="tab-strip" class="tabs" role="tablist" aria-label="Open files"></div>
            <!-- Vùng kéo cửa sổ: phần trống bên phải dải tab (nút cuộn, nút cửa sổ). -->
            <div class="titlebar-drag" data-tauri-drag-region></div>
            <!-- 2 nút cuộn dải tab, chỉ hiện khi tab tràn (tabs.js bật/tắt [hidden]). -->
            <div class="tabs-nav">
                <button id="tab-scroll-left" class="tabs-nav-btn" type="button" title="Scroll tabs left" aria-label="Scroll tabs left" hidden>
                    <i data-lucide="chevron-left"></i>
                </button>
                <button id="tab-scroll-right" class="tabs-nav-btn" type="button" title="Scroll tabs right" aria-label="Scroll tabs right" hidden>
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
            <div class="window-controls">
                <button id="win-min" class="win-btn" type="button" title="Minimize" aria-label="Minimize">
                    <i data-lucide="minus"></i>
                </button>
                <button id="win-max" class="win-btn" type="button" title="Maximize / Restore" aria-label="Maximize or restore">
                    <i data-lucide="square" class="icon-max"></i>
                    <i data-lucide="copy" class="icon-restore"></i>
                </button>
                <button id="win-close" class="win-btn win-close" type="button" title="Close" aria-label="Close">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>
        <div class="toolbar" role="toolbar" aria-label="Document toolbar">
            <div class="toolbar-group">
                <button id="btn-import" class="btn" title="Open one or more Markdown files (Ctrl+O)" aria-label="Open files">
                    <span class="btn-label">Open</span>
                </button>
                <button id="btn-recent" class="btn" title="Recently opened files" aria-label="Recently opened files" aria-haspopup="menu" hidden>
                    <span class="btn-label">Recent</span>
                </button>
                <button id="btn-save" class="btn" title="Save this file (Ctrl+S)" aria-label="Save" disabled>
                    <span class="btn-label">Save</span>
                </button>
                <button id="btn-save-as" class="btn" title="Save this file under a new name (Ctrl+Shift+S)" aria-label="Save as">
                    <span class="btn-label">Save As</span>
                </button>
                <button id="btn-save-all" class="btn" title="Save every changed tab (Ctrl+Alt+S)" aria-label="Save all" hidden>
                    <span class="btn-label">Save All</span>
                </button>
                <button id="btn-copy" class="btn" title="Copy Markdown content" aria-label="Copy">
                    <span class="btn-label">Copy</span>
                </button>
                <div class="export-wrap">
                    <button id="btn-export" class="btn" title="Export file (HTML / DOC / PDF)" aria-haspopup="menu" aria-expanded="false" aria-label="Export">
                        <span class="btn-label">Export</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div id="export-menu" class="export-menu hidden" role="menu">
                        <button id="export-html" class="export-item" role="menuitem" title="Export HTML file (.html)">
                            <i data-lucide="file-code-2"></i>
                            <span>HTML (.html)</span>
                        </button>
                        <button id="export-doc" class="export-item" role="menuitem" title="Export Word file (.doc)">
                            <i data-lucide="file-text"></i>
                            <span>Word (.doc)</span>
                        </button>
                        <button id="export-pdf" class="export-item" role="menuitem" title="Export PDF via the Print dialog">
                            <i data-lucide="printer"></i>
                            <span>Print (.pdf)</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="view-wrap">
                <button id="btn-view" class="btn" title="Switch view mode (Editor / Split / Preview)" aria-haspopup="menu" aria-expanded="false" aria-label="View mode">
                    <i data-lucide="pencil" class="icon-editor"></i>
                    <i data-lucide="columns-2" class="icon-split"></i>
                    <i data-lucide="eye" class="icon-preview"></i>
                    <span class="btn-label label-editor">Editor</span>
                    <span class="btn-label label-split">Split</span>
                    <span class="btn-label label-preview">Preview</span>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </button>
                <div id="view-menu" class="export-menu hidden" role="menu">
                    <button class="view-item" data-view="editor" role="menuitem" title="Show only the editor">
                        <i data-lucide="pencil"></i>
                        <span>Editor</span>
                    </button>
                    <button class="view-item" data-view="split" role="menuitem" title="Show editor and preview side by side">
                        <i data-lucide="columns-2"></i>
                        <span>Split</span>
                    </button>
                    <button class="view-item" data-view="preview" role="menuitem" title="Show only the preview">
                        <i data-lucide="eye"></i>
                        <span>Preview</span>
                    </button>
                </div>
            </div>

            <button id="btn-sync" class="btn active" title="Sync scroll" aria-label="Sync scroll" aria-pressed="true">
                <i data-lucide="arrow-up-down"></i>
                <span class="btn-label">Scroll</span>
            </button>

            <button id="btn-theme" class="btn" title="Toggle Light / Dark theme" aria-label="Toggle theme">
                <i data-lucide="sun" class="icon-sun"></i>
                <i data-lucide="moon" class="icon-moon"></i>
                <span class="btn-label label-light">Light</span>
                <span class="btn-label label-dark">Dark</span>
            </button>

            <div class="help-wrap">
                <button id="btn-help" class="btn" title="About Markdown Live" aria-haspopup="dialog" aria-controls="info-dialog" aria-label="About">
                    <i data-lucide="circle-help"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="workspace">
        <section class="pane editor-pane">
            <div class="format-bar" role="toolbar" aria-label="Formatting toolbar">
                <button id="btn-undo" class="btn-icon" title="Undo (Ctrl+Z)" aria-label="Undo">
                    <i data-lucide="undo-2"></i>
                </button>
                <button id="btn-redo" class="btn-icon" title="Redo (Ctrl+Y)" aria-label="Redo">
                    <i data-lucide="redo-2"></i>
                </button>
                <button id="btn-clear" class="btn-icon" title="Clear editor" aria-label="Clear editor">
                    <i data-lucide="eraser"></i>
                </button>
                <div class="format-bar-sep" role="separator"></div>
                <div class="format-wrap">
                    <button id="btn-heading" class="btn-icon" title="Headings" aria-haspopup="menu" aria-expanded="false">
                        <i data-lucide="heading-1"></i>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div id="heading-menu" class="format-menu hidden" role="menu" aria-label="Heading level">
                        <button class="format-item" data-heading="1" role="menuitem"><i data-lucide="heading-1" class="h1"></i><span>Heading 1</span></button>
                        <button class="format-item" data-heading="2" role="menuitem"><i data-lucide="heading-2" class="h2"></i><span>Heading 2</span></button>
                        <button class="format-item" data-heading="3" role="menuitem"><i data-lucide="heading-3" class="h3"></i><span>Heading 3</span></button>
                        <button class="format-item" data-heading="4" role="menuitem"><i data-lucide="heading-4" class="h4"></i><span>Heading 4</span></button>
                        <button class="format-item" data-heading="5" role="menuitem"><i data-lucide="heading-5" class="h5"></i><span>Heading 5</span></button>
                        <button class="format-item" data-heading="6" role="menuitem"><i data-lucide="heading-6" class="h6"></i><span>Heading 6</span></button>
                        <div class="format-menu-sep" role="separator"></div>
                        <button class="format-item" data-heading="0" role="menuitem"><i data-lucide="pilcrow" class="plain"></i><span>Plain text</span></button>
                    </div>
                </div>
                <div class="format-wrap">
                    <button id="btn-list" class="btn-icon" title="Lists" aria-haspopup="menu" aria-expanded="false">
                        <i data-lucide="list"></i>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div id="list-menu" class="format-menu hidden" role="menu" aria-label="List style">
                        <button class="format-item" data-list="bullet" role="menuitem"><i data-lucide="list"></i><span>Bulleted list</span></button>
                        <button class="format-item" data-list="numbered" role="menuitem"><i data-lucide="list-ordered"></i><span>Numbered list</span></button>
                        <button class="format-item" data-list="task" role="menuitem"><i data-lucide="list-todo"></i><span>Task list</span></button>
                    </div>
                </div>
                <button id="btn-bold" class="btn-icon" title="Bold (Ctrl+B)" aria-label="Bold">
                    <i data-lucide="bold"></i>
                </button>
                <button id="btn-italic" class="btn-icon" title="Italic (Ctrl+I)" aria-label="Italic">
                    <i data-lucide="italic"></i>
                </button>
                <button id="btn-strike" class="btn-icon" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough">
                    <i data-lucide="strikethrough"></i>
                </button>
                <button id="btn-link" class="btn-icon" title="Insert link (Ctrl+K)" aria-label="Insert link">
                    <i data-lucide="link-2"></i>
                </button>
                <div class="format-wrap">
                    <button id="btn-table" class="btn-icon" title="Insert table" aria-haspopup="menu" aria-expanded="false">
                        <i data-lucide="table-2"></i>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div id="table-menu" class="format-menu table-picker hidden" role="menu" aria-label="Table size">
                        <div class="table-grid">
                            <!-- 25 ô lưới được sinh sẵn bằng JS (5x5). Nút "Custom size" nằm ngay dưới. -->
                        </div>
                        <button class="format-item" data-table="custom" role="menuitem"><i data-lucide="table-2"></i><span>Custom size</span></button>
                    </div>
                </div>
                <div class="format-wrap">
                    <button id="btn-html" class="btn-icon" title="HTML inline (Sup / Sub / Kbd / Mark)" aria-haspopup="menu" aria-expanded="false">
                        <i data-lucide="braces"></i>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <div id="html-menu" class="format-menu hidden" role="menu" aria-label="HTML inline elements">
                        <button class="format-item" data-html="sup" role="menuitem" title="Wrap selection in <sup>"><i data-lucide="superscript"></i><span>Superscript</span></button>
                        <button class="format-item" data-html="sub" role="menuitem" title="Wrap selection in <sub>"><i data-lucide="subscript"></i><span>Subscript</span></button>
                        <button class="format-item" data-html="kbd" role="menuitem" title="Wrap selection in <kbd>"><i data-lucide="keyboard"></i><span>Keyboard key</span></button>
                        <button class="format-item" data-html="mark" role="menuitem" title="Wrap selection in <mark>"><i data-lucide="highlighter"></i><span>Highlight</span></button>
                    </div>
                </div>
                <button id="btn-code-inline" class="btn-icon" title="Inline code (Ctrl+E)" aria-label="Inline code">
                    <i data-lucide="code"></i>
                </button>
                <button id="btn-code-block" class="btn-icon" title="Code block" aria-label="Code block">
                    <i data-lucide="square-code"></i>
                </button>
                <button id="btn-math-inline" class="btn-icon" title="Inline math" aria-label="Inline math">
                    <i data-lucide="sigma"></i>
                </button>
                <button id="btn-math-block" class="btn-icon" title="Math block" aria-label="Math block">
                    <i data-lucide="square-radical"></i>
                </button>
                <button id="btn-quote" class="btn-icon" title="Blockquote" aria-label="Blockquote">
                    <i data-lucide="text-quote"></i>
                </button>
                <button id="btn-mermaid" class="btn-icon" title="Mermaid diagram" aria-label="Mermaid diagram">
                    <i data-lucide="workflow"></i>
                </button>
            </div>
            <div class="editor-container">
                <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"><code id="editor-highlight-code"></code></pre>
                <textarea id="markdown-input" spellcheck="false" placeholder="Type Markdown here..."></textarea>
            </div>
        </section>

        <div id="pane-resizer" role="separator" aria-orientation="vertical" title="Drag to resize panes"></div>

        <section class="pane preview-pane">
            <div id="preview-output" class="markdown-body"></div>
        </section>
    </main>

    <!-- Thanh trạng thái: EOL (bấm để đổi), vị trí con trỏ, mã hoá UTF-8, số ký tự (hiện cả ở Preview). -->
    <footer class="status-bar" role="status" aria-label="Document status">
        <button id="status-eol" class="status-item" type="button" title="Line ending - click to switch (LF / CRLF)"></button>
        <span id="status-pos" class="status-item"></span>
        <span id="status-encoding" class="status-item">UTF-8</span>
        <span id="char-counter" class="status-item">0 characters</span>
    </footer>

    <div id="link-dialog" class="dialog-overlay hidden">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="link-dialog-title">
            <h2 id="link-dialog-title">Link</h2>
            <label for="link-text">Display text</label>
            <input type="text" id="link-text" placeholder="Text for the link (optional)">
            <label for="link-url">Address</label>
            <input type="text" id="link-url" placeholder="Link to an existing webpage">
            <div class="dialog-actions">
                <button id="link-insert" class="dialog-btn primary" disabled>Insert</button>
                <button id="link-cancel" class="dialog-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="table-dialog" class="dialog-overlay hidden">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="table-dialog-title">
            <h2 id="table-dialog-title">Insert table</h2>
            <label for="table-cols">Number of columns</label>
            <input type="number" id="table-cols" min="1" max="99" value="3">
            <label for="table-rows">Number of rows</label>
            <input type="number" id="table-rows" min="1" max="99" value="3">
            <div class="dialog-actions">
                <button id="table-insert" class="dialog-btn primary">Insert</button>
                <button id="table-cancel" class="dialog-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- About: logo, tên, phiên bản và 2 mục đọc tài liệu; data-doc chỉ nhận 2 tên hardcode. -->
    <div id="info-dialog" class="dialog-overlay hidden">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="info-about-title">
            <div id="info-about">
                <img class="about-logo" src="assets/icon-128.png" alt="">
                <h2 id="info-about-title">Markdown Live</h2>
                <p class="about-version">Version <span id="app-version"></span></p>
                <div class="about-list">
                    <button class="export-item about-item" data-doc="LICENSE" title="Application license (MIT)">
                        <span>License</span>
                    </button>
                    <button class="export-item about-item" data-doc="THIRD_PARTY_NOTICES.md" title="Licenses of bundled third-party libraries">
                        <span>Third-party Notices</span>
                    </button>
                </div>
            </div>
            <div id="info-doc" class="hidden">
                <div class="info-doc-head">
                    <button id="info-back" class="dialog-btn">
                        <i data-lucide="arrow-left"></i>
                        <span>Back</span>
                    </button>
                </div>
                <div id="info-body" class="markdown-body dialog-scroll"></div>
            </div>
            <div class="dialog-actions">
                <button id="info-close" class="dialog-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Hộp thoại hỏi cho quyết định không thể đảo ngược; confirm() của WebView không có nút Lưu. -->
    <div id="confirm-dialog" class="dialog-overlay hidden">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h2 id="confirm-title">Confirm</h2>
            <p id="confirm-message" class="confirm-message"></p>
            <div class="dialog-actions">
                <button id="confirm-primary" class="dialog-btn primary" type="button"></button>
                <button id="confirm-secondary" class="dialog-btn" type="button"></button>
                <button id="confirm-cancel" class="dialog-btn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Overlay khi kéo file vào cửa sổ (class .drop-target trên body); pointer-events: none. -->
    <div class="drop-overlay" aria-hidden="true">Drop Markdown files here</div>

    <div id="toast" class="toast hidden">Notification appears here</div>

    <!-- App entry: ES module tự defer, chạy sau các thư viện vendor ở trên. -->
    <script type="module" src="js/main.js?v=2.0.3"></script>
</body>
</html>
